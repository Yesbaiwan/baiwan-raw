### 桌面 + iOS 通用单文件
### 设计: 白名单直连 + 核心服务分流，其余一律走节点；无地区/应用/特殊分组；4 策略组
### 广告拦截: 内置 GEOSITE + SukkaLab reject 系列 + ACL4SSR BanEasyListChina
### iOS 兼容: 规则集走 cdn.jsdelivr.net 不带 proxy 字段；fake-ip-filter 不引规则集；保留 include-all
### 使用: Sub-Store / 订阅转换把机场订阅合并进 include-all 策略组

### 全局配置
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
ipv6: false
etag-support: true
profile: { store-selected: true, store-fake-ip: true }

### Geo 数据（jsDelivr 镜像，避免 CN 拉取 GitHub 超时卡启动）
geo-auto-update: true
geo-update-interval: 24
geox-url:
    geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
    asn: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

### DNS 配置
dns:
    enable: true
    ipv6: false
    enhanced-mode: fake-ip
    prefer-h3: true
    use-system-hosts: true
    # 引导 DNS（纯 IP，用于解析 DoH 域名）
    default-nameserver: [180.184.1.1, 119.29.29.29, 223.5.5.5]
    # 域名策略（指定域名走指定 DNS）
    nameserver-policy:
        # 国内域名用裸 IP 直连更快
        'geosite:cn,private,apple': [180.184.1.1, 119.29.29.29, 223.5.5.5]
        # 广告域名在 DNS 层直接返回空解析
        'geosite:category-ads-all': [rcode://success]
        'rule-set:reject_non_ip,reject_non_ip_drop,reject_non_ip_no_drop': [rcode://success]
        # linux.do 走指定 DNS
        'DOMAIN-SUFFIX,linux.do': 'https://baiwan.ddd.oaifree.com:443/query-dns'
    # 默认 DNS（DoH 防污染，代理域名由节点自行解析）
    nameserver: [https://223.5.5.5/dns-query, https://dns.pub/dns-query]
    # 节点域名 DNS（解析机场节点地址，用 IP DNS 避免循环依赖）
    proxy-server-nameserver: [180.184.1.1, 119.29.29.29, 223.5.5.5]
    fake-ip-range: 198.18.0.0/16
    fake-ip-filter: ['*.lan', '*.local', '+.localdomain', '+.home.arpa', 'geosite:cn,private', '+.push.apple.com', 'time.*.com', 'ntp.*.com', 'pool.ntp.org', '*.msftconnecttest.com', '*.msftncsi.com']

### 域名嗅探
sniffer:
    enable: true
    parse-pure-ip: true
    sniff:
        HTTP: { ports: [80, 8080-8880], override-destination: true }
        TLS: { ports: [443, 8443] }
        QUIC: { ports: [443, 8443] }
    skip-domain:
        - 'Mijia Cloud'
        - dlg.io.mi.com
        - '+.push.apple.com'

### 策略组
proxy-groups:
    - name: 🚀 节点选择
      type: select
      include-all: true
      proxies: [♻️ 自动选择, DIRECT]
    - name: ♻️ 自动选择
      type: url-test
      include-all: true
      url: 'https://www.gstatic.com/generate_204'
      interval: 300
      lazy: true
      timeout: 2000
      tolerance: 50
      max-failed-times: 3
    - name: 🎯 全球直连
      type: select
      proxies: [DIRECT, 🚀 节点选择, ♻️ 自动选择]
    - name: 🐟 漏网之鱼
      type: select
      include-all: true
      proxies: [🚀 节点选择, 🎯 全球直连, ♻️ 自动选择, DIRECT]

### 规则集模板锚点
RuleSet_domain: &RuleSet_domain { type: http, behavior: domain, interval: 86400, format: mrs }
RuleSet_ipcidr: &RuleSet_ipcidr { type: http, behavior: ipcidr, interval: 86400, format: mrs }
RuleSet_classical: &RuleSet_classical { type: http, behavior: classical, interval: 86400, format: text }

### 订阅规则
rule-providers:
    # 广告/骚扰拦截
    reject_non_ip_no_drop: { <<: *RuleSet_classical, url: 'https://cdn.jsdelivr.net/gh/SukkaLab/ruleset.skk.moe@master/Clash/non_ip/reject-no-drop.txt', path: ./rule_set/sukkaw_ruleset/reject_non_ip_no_drop.txt }
    reject_non_ip_drop: { <<: *RuleSet_classical, url: 'https://cdn.jsdelivr.net/gh/SukkaLab/ruleset.skk.moe@master/Clash/non_ip/reject-drop.txt', path: ./rule_set/sukkaw_ruleset/reject_non_ip_drop.txt }
    reject_non_ip: { <<: *RuleSet_classical, url: 'https://cdn.jsdelivr.net/gh/SukkaLab/ruleset.skk.moe@master/Clash/non_ip/reject.txt', path: ./rule_set/sukkaw_ruleset/reject_non_ip.txt }
    reject_ip: { <<: *RuleSet_classical, url: 'https://cdn.jsdelivr.net/gh/SukkaLab/ruleset.skk.moe@master/Clash/ip/reject.txt', path: ./rule_set/sukkaw_ruleset/reject_ip.txt }
    # 中国广告全量
    ban_easylist_china: { <<: *RuleSet_classical, url: 'https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanEasyListChina.list', path: ./rule_set/other_ruleset/ban_easylist_china.txt }

    # 核心服务
    cn_domain: { <<: *RuleSet_domain, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs', path: ./rule_set/geosite/cn.mrs }
    private_domain: { <<: *RuleSet_domain, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs', path: ./rule_set/geosite/private.mrs }
    apple_domain: { <<: *RuleSet_domain, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs', path: ./rule_set/geosite/apple.mrs }
    microsoft_domain: { <<: *RuleSet_domain, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.mrs', path: ./rule_set/geosite/microsoft.mrs }
    google_domain: { <<: *RuleSet_domain, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.mrs', path: ./rule_set/geosite/google.mrs }
    telegram_domain: { <<: *RuleSet_domain, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs', path: ./rule_set/geosite/telegram.mrs }
    # 国内 IP
    china_ip: { <<: *RuleSet_ipcidr, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs', path: ./rule_set/geosite/china_ip.mrs }

### 分流规则
rules:
    # ========== 自定义规则（最高优先级） ==========
    - DOMAIN-SUFFIX,hf.space,🎯 全球直连
    - DOMAIN-SUFFIX,opencode.ai,🎯 全球直连
    - DOMAIN-SUFFIX,z.ai,🎯 全球直连
    - DOMAIN-SUFFIX,ruoli.dev,🎯 全球直连
    - DOMAIN-SUFFIX,zhubaiwan.xyz,🎯 全球直连
    - DOMAIN-SUFFIX,immersivetranslate.com,🎯 全球直连
    - DOMAIN-SUFFIX,gh-proxy.com,🎯 全球直连
    - DOMAIN-SUFFIX,gh-proxy.org,🎯 全球直连
    - DOMAIN,sfo1.aihub.zeabur.ai,🎯 全球直连
    - DOMAIN,hnd1.aihub.zeabur.ai,🎯 全球直连
    - DOMAIN-SUFFIX,jable.tv,🚀 节点选择
    # =============================================

    # 广告/骚扰拦截
    - GEOSITE,category-ads-all,REJECT
    - RULE-SET,reject_non_ip,REJECT
    - RULE-SET,reject_non_ip_drop,REJECT-DROP
    - RULE-SET,reject_non_ip_no_drop,REJECT
    - RULE-SET,ban_easylist_china,REJECT

    # 私网/局域网
    - RULE-SET,private_domain,DIRECT
    - GEOIP,LAN,DIRECT,no-resolve

    # 核心服务
    - RULE-SET,apple_domain,DIRECT
    - RULE-SET,microsoft_domain,DIRECT
    - RULE-SET,google_domain,🚀 节点选择
    - RULE-SET,telegram_domain,🚀 节点选择

    # 国内直连
    - RULE-SET,cn_domain,DIRECT
    - RULE-SET,china_ip,DIRECT,no-resolve

    # IP 类广告拦截
    - RULE-SET,reject_ip,REJECT

    # 兜底
    - MATCH,🐟 漏网之鱼
