mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'
unified-delay: true
tcp-concurrent: true
ipv6: false
dns:
    enable: true
    ipv6: false
    follow-rule: false
    respect-rules: true
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter: ['*.lan', localhost, '*.local', 'opencode.ai', '*.opencode.ai']
    use-hosts: true
    default-nameserver: [180.184.1.1, 180.184.2.2, 1.1.1.1, 1.0.0.1, 119.29.29.29, 182.254.116.116]
    proxy-server-nameserver: ['https://cdn.ookkzz.com/message-chat/hello-cn']
    proxy-server-nameserver-policy: { 'Bilibili-image-cdn.juhazf.cn': ['https://cdn.ookkzz.com/message-chat/hello-cn'] }
    nameserver: [180.184.1.1, 180.184.2.2, 1.1.1.1, 1.0.0.1, 119.29.29.29, 182.254.116.116]
    direct-nameserver: [https://1.1.1.1/dns-query, https://doh.pub/dns-query]
    fallback: [https://1.1.1.1/dns-query, https://doh.pub/dns-query, https://dns.alidns.com/dns-query]
    fallback-filter: { geoip: true, geoip-code: CN, geosite: [gfw] }
