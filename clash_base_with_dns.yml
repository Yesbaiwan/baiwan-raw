### 参考自 https://github.com/Seameee/override-hub/blob/main/selfuse_test_remote.yaml
### 全局配置
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
keep-alive-idle: 180
find-process-mode: strict
global-client-fingerprint: chrome
ipv6: false
profile:
    store-selected: true
    store-fake-ip: true

### DNS 配置
dns:
    enable: true
    ipv6: false
    enhanced-mode: fake-ip
    prefer-h3: true
    use-hosts: true
    use-system-hosts: true

    # 引导 DNS（纯 IP，用于解析 DoH 域名）
    default-nameserver:
        - 180.184.1.1
        - 119.29.29.29
        - 223.5.5.5

    # 域名策略（指定域名走指定 DNS）
    nameserver-policy:
        # 国内域名用裸 IP 直连更快
        'geosite:cn,private,apple':
            - 180.184.1.1
            - 119.29.29.29
            - 223.5.5.5
        'DOMAIN-SUFFIX,linux.do': 'https://baiwan.ddd.oaifree.com:443/query-dns'
        # 自定义域名专用 DoH（DOMAIN-SUFFIX 官方格式）
        'DOMAIN-SUFFIX,acczzz.com':
            - https://custom.juhazf.cn/inst
            - https://cdn.ookkzz.com/message-chat/hello-cn
        'DOMAIN-SUFFIX,hi2026.net':
            - https://custom.juhazf.cn/inst
            - https://cdn.ookkzz.com/message-chat/hello-cn
        'DOMAIN-SUFFIX,juhazf.cn':
            - https://custom.juhazf.cn/inst
            - https://cdn.ookkzz.com/message-chat/hello-cn
        # 广告/骚扰域名在 DNS 层直接返回空解析（与 Self 一致）
        'rule-set:reject_non_ip,reject_domainset,reject_non_ip_drop,reject_non_ip_no_drop': [rcode://success]

    # 默认 DNS（未命中策略的域名走 DoH 防污染，fake-ip 下代理节点自行解析域名）
    nameserver:
        - https://223.5.5.5/dns-query
        - https://dns.pub/dns-query

    # 节点域名 DNS（解析机场节点地址，必须用 IP DNS 避免循环依赖）
    proxy-server-nameserver:
        - 180.184.1.1
        - 119.29.29.29
        - 223.5.5.5

    fake-ip-range: 198.18.0.0/16
    fake-ip-filter:
        - 'rule-set:fakeip-filter,trackerslist,private,cn'

### 域名嗅探
sniffer:
    enable: true
    parse-pure-ip: true
    sniff:
        HTTP:
            ports: [80, 8080-8880]
            override-destination: true
        TLS:
            ports: [443, 8443]
        QUIC:
            ports: [443, 8443]
    skip-domain:
        - 'Mijia Cloud'
        - dlg.io.mi.com
        - '+.push.apple.com'

### 策略组（保持精简，无地区/应用分组）
proxy-groups:
    # 主选择组
    - name: 🚀 节点选择
      type: select
      include-all: true
      proxies: [♻️ 自动选择, DIRECT]

    # 自动测速
    - name: ♻️ 自动选择
      type: url-test
      include-all: true
      url: 'https://www.gstatic.com/generate_204'
      interval: 300
      lazy: true
      timeout: 2000
      tolerance: 50
      max-failed-times: 3

    # 直连组
    - name: 🎯 全球直连
      type: select
      proxies: [DIRECT, 🚀 节点选择, ♻️ 自动选择]

    # 兜底组
    - name: 🐟 漏网之鱼
      type: select
      include-all: true
      proxies: [🚀 节点选择, 🎯 全球直连, ♻️ 自动选择, DIRECT]

### 规则集配置
RuleSet_classical: &RuleSet_classical { type: http, behavior: classical, interval: 43200, format: text, proxy: 🚀 节点选择 }
RuleSet_domain: &RuleSet_domain { type: http, behavior: domain, interval: 43200, format: text, proxy: 🚀 节点选择 }
RuleSet_ipcidr: &RuleSet_ipcidr { type: http, behavior: ipcidr, interval: 43200, format: text, proxy: 🚀 节点选择 }
RuleSet_domain_mrs: &RuleSet_domain_mrs { type: http, behavior: domain, interval: 43200, format: mrs, proxy: 🚀 节点选择 }
RuleSet_ipcidr_mrs: &RuleSet_ipcidr_mrs { type: http, behavior: ipcidr, interval: 43200, format: mrs, proxy: 🚀 节点选择 }

