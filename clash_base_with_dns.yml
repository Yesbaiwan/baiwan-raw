mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'
unified-delay: true
tcp-concurrent: true
ipv6: false
dns:
    # 参考 https://linux.do/t/topic/1999640
    enable: true
    ipv6: false
    enhanced-mode: fake-ip
    use-hosts: true

    # 0. 引导 DNS（纯 IP，用于解析 DOH 域名）
    default-nameserver:
        - 180.184.1.1
        - 119.29.29.29
        - 223.5.5.5

    # 1. 域名策略（指定域名走指定 DNS）
    nameserver-policy:
        'geosite:cn,private,apple':
            - 180.184.1.1
            - 119.29.29.29
            - 223.5.5.5
        'Bilibili-image-cdn.juhazf.cn': 'https://cdn.ookkzz.com/message-chat/hello-cn'
        '*.linux.do': 'https://baiwan.ddd.oaifree.com/query-dns'
        'linux.do': 'https://baiwan.ddd.oaifree.com/query-dns'

    # 2. 默认 DNS（未命中策略的域名，fake-ip 下代理节点自行解析域名）
    nameserver:
        - 180.184.1.1
        - 119.29.29.29
        - 223.5.5.5

    # 3. 节点域名 DNS（解析机场节点地址，必须用 IP DNS 避免循环依赖）
    proxy-server-nameserver:
        - 180.184.1.1
        - 119.29.29.29
        - 223.5.5.5

    fake-ip-range: 198.18.0.0/16
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - 'time.*.com'
        - 'ntp.*.com'
        - '+.market.xiaomi.com'
        - 'localhost.ptlogin2.qq.com'
        - '*.msftncsi.com'
        - 'www.msftconnecttest.com'
        - 'opencode.ai'
        - '*.opencode.ai'
